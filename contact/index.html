<style>
:root{--black:#111111;--black-2:#1A1A1A;--line:rgba(244,239,228,0.14);--lime:#C8F03C;--cream:#F4EFE4;--muted:#BDB6AE;--serif:'Fraunces',Georgia,serif;--sans:'Instrument Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--black);color:var(--cream);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:var(--lime);text-decoration:none}
a:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 20px}
header{padding:28px 0}
.wordmark{display:inline-flex;flex-direction:column;align-items:flex-start;color:var(--cream);font-size:34px}
.wm-word{font-family:var(--serif);font-weight:300;line-height:1;letter-spacing:-0.01em}
.wm-i{position:relative;display:inline-block}
.wm-i svg{position:absolute;left:50%;top:.21em;width:.21em;height:.14em;transform:translateX(-50%);fill:var(--lime)}
.wm-sub{font-size:.3em;font-weight:500;letter-spacing:.6em;text-transform:uppercase;color:var(--lime);margin-top:.35em;font-family:var(--sans)}
main{flex:1;padding:24px 0 56px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--lime)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,12vw,64px);line-height:1;letter-spacing:-0.015em;margin:14px 0 12px}
.org{color:var(--muted);font-size:18px}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:40px}
.btn{display:flex;align-items:center;gap:14px;min-height:76px;padding:0 22px;border-radius:16px;border:1px solid var(--line);background:var(--black-2);color:var(--cream);font-size:18px;font-weight:500;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--lime)}
.btn svg.i{flex:none;width:22px;height:22px;stroke:var(--lime);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn .lbl{display:flex;flex-direction:column;line-height:1.25}
.btn .lbl small{font-size:14px;color:var(--muted);font-weight:400}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--black);font-weight:600}
.btn.primary svg.i{stroke:var(--black)}
.btn.primary .lbl small{color:#3A4410}
.btn .go{margin-left:auto;width:12px;height:18px;fill:none;stroke:currentColor;stroke-width:2;opacity:.6}
footer{border-top:1px solid var(--line);padding:24px 0 36px;color:var(--muted);font-size:14px}
footer a{color:var(--cream)}
.tag{font-family:var(--serif);font-style:italic;font-weight:300;color:var(--muted);margin-top:32px;font-size:16px}
.photo{width:120px;height:120px;border-radius:50%;display:block;margin-bottom:28px;box-shadow:0 0 0 2px #111111,0 0 0 4px var(--lime)}
.btn img.av{flex:none;width:52px;height:52px;border-radius:50%;margin-left:-6px}

/* site navigation (shared) */
header.site-header{position:sticky;top:0;z-index:20;padding:0;background:rgba(17,17,17,0.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(244,239,228,0.14)}
.sn{max-width:1160px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}
header.site-header .wordmark{font-size:34px;flex-direction:row;text-decoration:none}
.sn-right{display:flex;align-items:center;gap:28px}
.sn-links{display:flex;gap:28px;list-style:none;margin:0;padding:0}
.sn-links a{color:#F4EFE4;font-size:15px;text-decoration:none}
.sn-links a:hover,.sn-links a[aria-current]{color:#C8F03C}
.sn-cta{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:#C8F03C;color:#111111;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.sn-cta:hover{background:#D8F76A;text-decoration:none}
.sn-cta,.sn-cta:link,.sn-cta:visited,.sn-cta:hover,.sn-cta:active{color:#111111 !important}
.sn-menu{display:none;position:relative}
.sn-menu summary{list-style:none;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(244,239,228,0.25);border-radius:12px;color:#F4EFE4}
.sn-menu summary::-webkit-details-marker{display:none}
.sn-menu summary svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none}
.sn-menu[open] summary{border-color:#C8F03C;color:#C8F03C}
.sn-panel{position:absolute;right:0;top:54px;min-width:230px;background:#1A1A1A;border:1px solid rgba(244,239,228,0.14);border-radius:14px;padding:8px;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.sn-panel a{padding:14px 16px;border-radius:10px;color:#F4EFE4;font-size:17px;text-decoration:none}
.sn-panel a:hover{background:rgba(244,239,228,0.06)}
@media (max-width:900px){.sn-links{display:none}.sn-menu{display:block}.sn-right{gap:10px}}
@media (max-width:420px){.sn{padding:0 16px}header.site-header .wordmark{font-size:28px}.sn-cta{padding:0 16px;font-size:14px}}
section[id]{scroll-margin-top:84px}
</style>
